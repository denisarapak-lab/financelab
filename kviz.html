                  btn: 'Chci probrat vlastní bydlení', topic: 'vaše bydlení' },
    mortgage:   { head: 'Chcete se podívat na svoji hypotéku.',
                  step: 'Připravte si současnou sazbu, zbývající dluh a datum konce fixace. Budeme mít z čeho vyjít při rozhovoru o možnostech úpravy hypotéky.',
                  stepSelf: 'Připravte si současnou sazbu, zbývající dluh a datum konce fixace. Z těchto tří údajů se pozná, jestli má smysl hypotéku upravovat.',
                  offerHead: 'Chcete vědět, jestli by šla hypotéka nastavit líp?',
                  offer: 'Na schůzce projdeme vaši současnou hypotéku a možnosti, jak ji upravit.',
                  btn: 'Chci probrat svoji hypotéku', topic: 'vaši hypotéku' },
    plan:       { head: 'Začít můžete tím, k čemu mají vaše peníze sloužit.',
                  step: 'Rozdělte si peníze podle toho, kdy je budete potřebovat: na nečekané výdaje, na plány v příštích letech a na dlouhodobé cíle. U každé části se pak snáz rozhodne, kam ji dát.',
                  offerHead: 'Chcete si ujasnit, k čemu mají vaše peníze sloužit?',
                  offer: 'Na krátké schůzce projdeme, co plánujete a kdy budete peníze potřebovat.', q8: true, docs: true,
                  btn: 'Chci probrat svoje možnosti', topic: 'to, k čemu mají vaše peníze sloužit' },
    surplus:    { head: 'Chcete vědět, co s penězi, které vám zbývají.',
                  step: 'Rozdělte si peníze podle toho, kdy je budete potřebovat: na nečekané výdaje, na plány v příštích letech a na dlouhodobé cíle. U každé části se pak snáz rozhodne, kam ji dát.',
                  offerHead: 'Chcete si ujasnit, co s penězi, které vám zbývají?',
                  offer: 'Na krátké schůzce projdeme, co plánujete a kdy budete peníze potřebovat.', q8: true, docs: true,
                  btn: 'Chci probrat svoje možnosti', topic: 'co s penězi, které vám zbývají' },
    budget:     { head: 'Začít můžete tím, kam vám peníze odcházejí.',
                  step: 'Projděte si výpis z účtu za poslední měsíc a rozdělte výdaje na nutné a ostatní. Uvidíte, kam peníze odcházejí, a snáz se rozhodne, co s tím dělat.',
                  offerHead: 'Chcete se podívat, kam vám peníze odcházejí?',
                  offer: 'Na krátké schůzce projdeme vaše výdaje a to, co plánujete.', q8: true, docs: true,
                  btn: 'Chci probrat svoje možnosti', topic: 'vaše výdaje' },
    security:   { head: 'Chcete mít doma klid i na nečekané výdaje.',
                  step: 'Sečtěte si nutné měsíční výdaje a porovnejte je s penězi, které máte po ruce. Uvidíte, jak dlouho byste vydrželi, kdyby se něco pokazilo.',
                  offerHead: 'Chcete vědět, jak jste připravení na nečekané výdaje?',
                  offer: 'Na krátké schůzce projdeme vaše výdaje, rezervu a to, co už máte sjednané.', q8: true, docs: true,
                  btn: 'Chci probrat svoje možnosti', topic: 'to, jak jste připravení na nečekané výdaje' },
    start:      { head: 'Pořádek v penězích začíná jedním přehledem.',
                  step: 'Sepište si na jedno místo, co máte: účty, úspory, pojistky, úvěry a pravidelné výdaje. Z jednoho přehledu se nejlíp pozná, čím začít.',
                  offerHead: 'Chcete si ujasnit, čím začít?',
                  offer: 'Na krátké schůzce projdeme, jak na tom teď jste.', q8: true, docs: true,
                  btn: 'Chci probrat, čím začít', topic: 'to, čím začít' },
    review:     { head: 'Chcete vědět, jestli to, co máte, pořád sedí.',
                  step: 'Sepište si, co máte sjednané (účty, spoření, pojistky, úvěry), a ke každé položce, k čemu slouží. Z jednoho přehledu se nejlíp pozná, co nechat a na co se zeptat.',
                  offerHead: 'Chcete si projít, co už máte?',
                  offer: 'Na krátké schůzce projdeme, co máte sjednané.', q8: true, docs: true,
                  btn: 'Chci projít, co už mám', topic: 'to, co už máte' },
    decision:   { head: 'Chcete se rozhodnout a mít to vyřízené.',
                  step: 'Sepište si, o čem se rozhodujete a do kdy to potřebujete mít vyřízené. Na rozhovor to bude nejlepší podklad.',
                  offerHead: 'Chcete probrat svoje rozhodnutí?',
                  offer: 'Na krátké schůzce si řekneme, o čem se rozhodujete.', q8: true,
                  btn: 'Chci probrat svoje rozhodnutí', topic: 'vaše rozhodnutí' },
    contact:    { head: 'Chcete mít se koho zeptat.',
                  step: 'Zapište si otázky, které vám teď kolem peněz běží hlavou. Na první rozhovor je to nejlepší podklad.',
                  offerHead: 'Chcete nás nejdřív poznat?',
                  offer: 'Na krátké schůzce probereme, co teď řešíte.', q8: true, docs: true,
                  btn: 'Chci se s vámi potkat', topic: 'to, co teď řešíte' }
  };

  // Krátký rozhovor popsaný podle odpovědi 8 (bez slibu hotového plánu)
  var Q8_LINE = [
    'Domluvíme se, čím začít.',
    'Podíváme se, jestli to, co máte, pořád dává smysl.',
    'Probereme možnosti a domluvíme se, jaké podklady budou potřeba.',
    'Poznáte nás a uvidíte, jestli vám náš přístup sedí.'
  ];

  // ---- state ------------------------------------------------------------
  var state = { screen: 'intro', qi: 0, answers: [] };

  // Zjištění = jen to, co člověk sám napsal. „Nevím“ u rezervy je neznámá hodnota, ne nulová rezerva.
  // Peníze na účtu nejsou automaticky chyba, žádná změna nevypovídá o kvalitě nastavení.
  function findingsFor(a, theme) {
    var f = [];
    if (a[2] === 4) f.push({ g: 'reserve', a: 'Píšete, že nevíte, na jak dlouho by vám úspory vystačily.', b: 'Zároveň nevíte, na jak dlouho by vám úspory vystačily.' });
    else if (a[2] === 0) f.push({ g: 'reserve', a: 'Píšete, že by vám úspory zatím nevystačily ani na měsíc.', b: 'Zároveň by vám úspory zatím nevystačily ani na měsíc.' });
    if (a[4] === 2) f.push({ g: 'lifechange',
      a: theme === 'lifechange' ? 'Píšete, že finance zatím zůstaly při starém.' : 'Píšete, že se u vás změnil život, ale finance zatím zůstaly při starém.',
      b: 'Zároveň se u vás změnil život, ale finance zatím zůstaly při starém.' });
    else if (a[4] === 1) f.push({ g: 'lifechange', a: 'Píšete, že jste se po změnách ke kontrole všeho ještě nedostali.', b: 'Zároveň jste se po změnách ke kontrole všeho ještě nedostali.' });
    if (a[6] === 2) f.push({ g: 'plan', a: 'Píšete, že vám na účtu zůstávají peníze, pro které zatím nemáte plán.', b: 'Zároveň vám na účtu zůstávají peníze, pro které zatím nemáte plán.' });
    else if (a[6] === 1) f.push({ g: 'plan', a: 'Píšete, že spoříte nebo investujete, ale konkrétní cíl zatím nemáte.', b: 'Zároveň spoříte nebo investujete, ale konkrétní cíl zatím nemáte.' });
    else if (a[6] === 3) f.push({ g: 'budget', a: 'Píšete, že vám teď většinou nic nezbývá.', b: 'Zároveň vám teď většinou nic nezbývá.' });
    // zjištění k tématu výsledku jde první, zobrazí se nejvýš dvě
    f.sort(function (x, y) { return (y.g === theme) - (x.g === theme); });
    return f.slice(0, 2);
  }

  function pickTheme(a) {
    var q1 = a[0], q8 = a[7], wantsHelp = q8 <= 3;
    if (q1 === 0) return 'housing';
    if (q1 === 1) return 'mortgage';
    if (a[2] === 0 || a[2] === 4) return 'reserve';
    if (a[4] === 2) return 'lifechange';
    if (a[6] === 1 || a[6] === 2) return 'plan';
    if (a[6] === 3) return 'budget';
    if (a[4] === 1) return 'lifechange';
    if (!wantsHelp) return null; // bez zjištění a bez zájmu o pomoc nic nevymýšlíme
    if (q1 === 2) return 'security';
    if (q1 === 3) return 'surplus';
    if (q1 === 4) return 'start';
    return ['start', 'review', 'decision', 'contact'][q8];
  }

  // „Máte přehled“ jen tehdy, když to plyne z odpovědí (ví, jak dlouho rezerva vydrží, peníze mají účel)
  function hasOverview(a) {
    return [1, 2, 3].indexOf(a[2]) > -1 && [0, 4].indexOf(a[6]) > -1 && [0, 4].indexOf(a[4]) > -1;
  }

  // ---- render helpers ---------------------------------------------------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function icons() { if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) {} } }
  function paint(html) {
    root.innerHTML = html;
    root.classList.remove('fade'); void root.offsetWidth; if (!reduce) root.classList.add('fade');
    icons();
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }

  // ---- screens ----------------------------------------------------------
  function renderIntro() {
    paint(
      '<div class="kviz-eyebrow">Finanční kvíz</div>' +
      '<h1 class="kviz-h1">Máte ve svých penězích jasno?</h1>' +
      '<p class="kviz-lead">Osm krátkých otázek o věcech, které řešíme všichni. Zkuste si, co víte, a podívejte se, co by stálo za to dořešit u vás.</p>' +
      '<button class="btn btn-dark" data-act="start" style="margin-top:26px;">Jdu na to <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' +
      '<div class="kviz-meta"><i data-lucide="clock" style="width:15px;height:15px;"></i> Asi 3 minuty. Výsledek hned, bez e-mailu.</div>'
    );
  }

  function renderQuestion() {
    var qi = state.qi, Q = QUESTIONS[qi], sel = state.answers[qi];
    var opts = Q.opts.map(function (t, i) {
      return '<button class="kviz-opt' + (sel === i ? ' sel' : '') + '" data-act="pick" data-i="' + i + '">' +
        '<span class="dot"><i data-lucide="check"></i></span><span>' + esc(t) + '</span></button>';
    }).join('');
    paint(
      '<div class="kviz-prog"><div class="track"><span style="width:' + ((qi + 1) / QUESTIONS.length * 100) + '%"></span></div>' +
      '<div class="lbl">' + (qi + 1) + ' / ' + QUESTIONS.length + '</div></div>' +
      '<div class="kviz-q">' + esc(Q.q) + '</div>' +
      (Q.help ? '<div class="kviz-qhelp">' + esc(Q.help) + '</div>' : '') +
      '<div class="kviz-opts">' + opts + '</div>' +
      '<div class="kviz-nav">' +
      '<button class="kviz-textbtn" data-act="back"' + (qi === 0 ? ' hidden' : '') + '><i data-lucide="arrow-left" style="width:15px;height:15px;"></i> Zpět</button>' +
      (sel != null ? '<button class="btn btn-dark" data-act="next">' + (qi === QUESTIONS.length - 1 ? 'Ukázat výsledek' : 'Pokračovat') + ' <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' : '<span></span>') +
      '</div>'
    );
  }

  function knowledgeHtml(a) {
    var right = 0;
    var rows = KNOW.map(function (k) {
      var ok = a[k.i] === QUESTIONS[k.i].correct;
      if (ok) right++;
      return '<div class="know-row">' +
        '<div class="know-q"><span class="tag ' + (ok ? 'tag-ok' : 'tag-no') + '"><i data-lucide="' + (ok ? 'check' : 'x') + '"></i></span>' + esc(k.title) + '</div>' +
        '<div class="know-a">Správně: <b>' + esc(k.correctText) + '</b></div>' +
        '<details class="know-more"' + (ok ? '' : ' open') + '><summary>Proč?</summary><p>' + esc(k.exp) + '</p></details>' +
        '</div>';
    }).join('');
    return '<div class="res-section-lbl">Znalostní otázky · správně ' + right + ' ze 3</div><div class="know">' + rows + '</div>';
  }

  function findingsHtml(f, T) {
    if (!f.length && !(T && T.note)) return '';
    var txt = f.map(function (x, i) { return i === 0 ? x.a : x.b; }).join(' ');
    if (T && T.note) txt += (txt ? ' ' : '') + T.note;
    return '<p class="res-sub">' + esc(txt) + '</p>';
  }

  function stepHtml(text) {
    return '<div class="res-step"><div class="res-step-lbl">První krok</div>' + esc(text) + '</div>';
  }

  function renderResult() {
    var a = state.answers, wantsHelp = a[7] <= 3;
    var theme = pickTheme(a), T = theme ? THEMES[theme] : null;
    var f = findingsFor(a, theme);
    var html = '';

    if (wantsHelp && T) {
      var body = T.offer + (T.q8 ? ' ' + Q8_LINE[a[7]] : '') + (T.docs ? ' Smlouvy předem hledat nemusíte.' : '');
      html =
        '<div class="res-head">' + esc(T.head) + '</div>' +
        findingsHtml(f, theme === 'lifechange' ? T : null) +
        stepHtml(T.step) +
        knowledgeHtml(a) +
        '<div class="offer">' +
        '<h3>' + esc(T.offerHead) + '</h3>' +
        '<p>' + esc(body) + '</p>' +
        '<button class="btn btn-lime" data-act="tobooking">' + esc(T.btn) + ' <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' +
        '</div>';
    } else {
      // Poslední dvě volby v otázce 8: žádný prodejní blok, výsledek a vysvětlení zůstávají.
      var intro;
      if (!T && !f.length && hasOverview(a)) intro = '<p class="res-sub">Podle toho, co píšete, máte o svých penězích přehled. Níže si můžete projít vysvětlení znalostních otázek.</p>';
      else if (!T && !f.length) intro = '<p class="res-sub">Níže si můžete projít vysvětlení znalostních otázek.</p>';
      else intro = findingsHtml(f, theme === 'lifechange' ? T : null);
      html =
        '<div class="res-head">Díky za vyplnění. Tady jsou odpovědi.</div>' +
        intro +
        (T ? stepHtml(T.stepSelf || T.step) : '') +
        knowledgeHtml(a) +
        '<div class="res-end"><a href="index.html" class="btn btn-white">Zpět na Finance Lab</a></div>';
    }
    paint(html);
  }

  function renderBooking() {
    var theme = pickTheme(state.answers), T = theme ? THEMES[theme] : null;
    var topic = T ? T.topic : 'to, co teď řešíte';
    var configured = CALENDLY_URL.indexOf('REPLACE') !== 0;
    var slot = configured
      ? '<div id="cal-embed" class="calendly-inline-widget" style="min-width:280px;height:660px;margin-top:20px;border-radius:16px;overflow:hidden;"></div>'
      : '<div class="cal-fallback">Výběr termínu tu brzy spustíme. Do té doby nám můžete napsat přes <a href="index.html#objednat">formulář na hlavní stránce</a> a ozveme se vám.</div>';
    paint(
      '<button class="kviz-textbtn" data-act="toresult" style="margin-bottom:14px;"><i data-lucide="arrow-left" style="width:15px;height:15px;"></i> Zpět na výsledek</button>' +
      '<div class="res-head" style="font-size:clamp(22px,3vw,30px);">Vyberte si čas, který vám sedí.</div>' +
      '<div style="font-family:Manrope,sans-serif;font-weight:700;font-size:15px;color:var(--ink);margin-top:14px;">Úvodní setkání s Finance Labem</div>' +
      '<div class="bk-meta"><span><i data-lucide="message-circle"></i>Krátký rozhovor</span><span><i data-lucide="video"></i>Online nebo osobně</span></div>' +
      '<p class="res-note" style="margin-top:12px;">Navážeme tam, kde kvíz skončil, a probereme hlavně ' + esc(topic) + '.' +
      (configured ? ' Termín vám potvrdíme e-mailem.' : '') + '</p>' +
      slot
    );
    if (configured) initCalendly(theme || 'none', topic);
  }

  // Napojení Calendly inline widgetu. Kontext z kvízu (téma výsledku) jde přes UTM parametry,
  // poradce ho uvidí u každé rezervace.
  function initCalendly(theme, topic) {
    var el = document.getElementById('cal-embed');
    if (!el) return;
    var sep = CALENDLY_URL.indexOf('?') > -1 ? '&' : '?';
    var url = CALENDLY_URL + sep +
      'hide_gdpr_banner=1&background_color=ffffff&text_color=17252b&primary_color=14352b' +
      '&utm_campaign=kviz&utm_source=web&utm_medium=kviz' +
      '&utm_content=' + encodeURIComponent(theme) +
      '&utm_term=' + encodeURIComponent(topic);
    var tries = 0;
    (function go() {
      if (window.Calendly && window.Calendly.initInlineWidget) {
        window.Calendly.initInlineWidget({ url: url, parentElement: el });
      } else if (tries++ < 40) { setTimeout(go, 150); }
    })();
  }

  // ---- global click handling -------------------------------------------
  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'start') { state.screen = 'quiz'; state.qi = 0; renderQuestion(); }
    else if (act === 'pick') {
      state.answers[state.qi] = parseInt(el.getAttribute('data-i'), 10);
      if (reduce) { advance(); }
      else {
        root.querySelectorAll('.kviz-opt').forEach(function (o) { o.classList.remove('sel'); });
        el.classList.add('sel');
        setTimeout(function () { advance(); }, 240);
      }
    }
    else if (act === 'next') { advance(); }
    else if (act === 'back') { if (state.qi > 0) { state.qi--; renderQuestion(); } }
    else if (act === 'tobooking') { state.screen = 'booking'; renderBooking(); }
    else if (act === 'toresult') { state.screen = 'result'; renderResult(); }
  });

  function advance() {
    if (state.answers[state.qi] == null) return;
    if (state.qi < QUESTIONS.length - 1) { state.qi++; renderQuestion(); }
    else { state.screen = 'result'; renderResult(); }
  }

  renderIntro();
})();
</script>
</body>
</html>
