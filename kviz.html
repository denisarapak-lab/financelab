  .res-step-lbl { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #2f7a56; margin-bottom: 6px; }

<script src="script.js"></script>
<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.getElementById('quiz-root');
  // Objednávkový formulář odesílá přes Web3Forms. Klíč je jeden pro celý web, nastavuje se v script.js.
  function formKey() { return window.FL_WEB3FORMS_KEY || ''; }

  // ---- otázky -----------------------------------------------------------
  // Indexy: 0 zůstatek · 1 znalost (půjčky) · 2 úspory · 3 znalost (pojištění bytu)
  //         4 znalost (úrazové pojištění) · 5 životní změny · 6 volné peníze (+ nepovinné políčko) · 7 cíl
  var QUESTIONS = [
    { q: 'Otevřete bankovnictví. Odpovídá zůstatek tomu, co jste čekali?',
      opts: [
        'Většinou ano. Zhruba vím, co přišlo a co odešlo.',
        'Občas mě překvapí, kolik už je pryč.',
        'Docela často si říkám: Kam to zase zmizelo?',
        'Na zůstatek se moc nedívám.'
      ] },
    { q: 'Dvě půjčky na stejnou částku. Jedna má nižší měsíční splátku. Je tím pádem levnější?',
      opts: [
        'Nemusí být. Záleží i na tom, jak dlouho budu splácet a kolik zaplatím celkem.',
        'Ano, každý měsíc přece zaplatím míň.',
        'Nevím, podle čeho je porovnat.'
      ], correct: 0 },
    { q: 'Na jak dlouho by vám vystačily úspory, kdyby přestal chodit příjem?',
      help: 'Stačí odhad. Počítejte bydlení, jídlo, splátky a další nutné výdaje. Vynechte peníze, které už máte stranou na něco jiného.',
      opts: [
        'Ani na měsíc.',
        'Alespoň na měsíc, ale na tři už ne.',
        'Na tři až šest měsíců.',
        'Na víc než půl roku.',
        'Nevím, nemám to spočítané.'
      ] },
    { q: 'Máte pojištěný byt. Jsou tím automaticky pojištěné i notebook a pohovka uvnitř?',
      opts: [
        'Ano, patří přece do bytu.',
        'Jen pokud jsou nové.',
        'Ne automaticky. Záleží, jestli je pojištěné i vybavení domácnosti.',
        'Nevím. Pod „pojištěným bytem“ si představuju všechno.'
      ], correct: 2 },
    { q: 'Máte úrazové pojištění. Pomůže vám automaticky i tehdy, když kvůli nemoci nemůžete pracovat?',
      opts: [
        'Ano, hlavní je, že nemůžu pracovat.',
        'Ne, musí v něm být pojištěná i nemoc.',
        'Nevím, v tomhle se nevyznám.'
      ], correct: 1 },
    { q: 'Nová práce, dítě, hypotéka… Když se něco změnilo u vás, podívali jste se i na svoje finance?',
      help: 'Třeba jestli pořád stačí rezerva nebo jestli pojistka odpovídá tomu, co dnes potřebujete.',
      opts: [
        'Ano, vím, co bylo potřeba upravit a co může zůstat.',
        'Něco ano, ale na všechno se ještě nedostalo.',
        'Život se změnil, finance zatím zůstaly při starém.',
        'Zatím nemám moc co kontrolovat, nic z toho se u mě neděje a nemám žádné finanční produkty.',
        'Nic většího se nezměnilo.'
      ] },
    { q: 'Když vám na konci měsíce zbydou peníze, co s nimi většinou uděláte?',
      opts: [
        'Dávám je na spořák.',
        'Investuju je.',
        'Chci s nimi něco dělat, ale v investování se zatím nevyznám.',
        'Nechávám je na běžném účtu na další měsíc.',
        'Teď mi většinou nic nezbývá.'
      ],
      // po volbě „Investuju je“ se ukáže nepovinné políčko, kvíz se pak neposouvá sám
      extra: { on: 1, label: 'Do čeho investujete?', hint: 'Klidně napište vlastními slovy.' } },
    { q: 'Co byste si chtěli jednou dovolit?',
      help: 'Vyberte, co je vám nejbližší.',
      opts: [
        'Pracovat míň a mít víc času pro sebe.',
        'Pustit se do vlastní práce nebo podnikání.',
        'Dát dětem lepší start do života.',
        'Dát si delší volno nebo vyrazit na velkou cestu.',
        'Něco jiného. Svůj plán už mám.',
        'Zatím nevím. Nad tímhle se chci zamyslet.'
      ] }

  // ---- znalostní otázky (hodnotí se zvlášť, nikdy nevedou k nabídce) ------
  var KNOW = [
    { i: 1, title: 'Nižší splátka a cena půjčky', correctText: 'Nemusí být. Záleží i na tom, jak dlouho budu splácet a kolik zaplatím celkem.',
      exp: 'Nižší splátka často znamená, že splácíte déle, a tím pádem zaplatíte víc na úrocích. Půjčky proto porovnávejte podle toho, kolik za ně zaplatíte celkem, a podle RPSN, která zahrnuje i poplatky.' },
    { i: 3, title: 'Pojištění bytu a věcí uvnitř', correctText: 'Ne automaticky. Záleží, jestli je pojištěné i vybavení domácnosti.',
      exp: 'Pojištění nemovitosti se týká samotného bytu: zdí, podlah, oken a pevně zabudovaných věcí. Nábytek, elektronika a další věci, které si můžete odnést, patří pod pojištění domácnosti. Ve smlouvě si ověřte, jestli máte obojí a na jakou částku.' },
    { i: 4, title: 'Úrazové pojištění a nemoc', correctText: 'Ne, musí v něm být pojištěná i nemoc.',

  ];

  // ---- témata výsledku podle osobních odpovědí ----------------------------
  var THEMES = {
    reserve:    { head: 'Začít můžete tím, kolik potřebujete mít po ruce.',
                  step: 'Na schůzce s vámi uděláme podrobnou analýzu příjmů a výdajů a spočítáme, na jak dlouho by vám úspory vystačily. Podle toho se domluvíme, kolik mít po ruce a co s ostatními penězi.' },
    spending:   { head: 'Začít můžete tím, kam vám peníze odcházejí.',
                  step: 'Na schůzce s vámi uděláme podrobnou analýzu příjmů a výdajů. Ukážeme vám, kam peníze odcházejí, a domluvíme se, co upravit.' },
    lifechange: { head: 'Od poslední kontroly se toho u vás změnilo.',
                  note: 'Vyplatí se ověřit, jestli rezerva a pojistky pořád odpovídají tomu, co dnes potřebujete platit a koho potřebujete zajistit.',
                  step: 'Na schůzce s vámi uděláme podrobnou analýzu příjmů a výdajů a projdeme, co už máte sjednané. Řekneme vám, co po změnách upravit a co může zůstat.' },
    invest:     { head: 'Než začnete investovat, vyplatí se vědět, kdy budete peníze potřebovat.',
                  step: 'Na schůzce s vámi uděláme podrobnou analýzu příjmů a výdajů a spočítáme, kolik peněz můžete investovat a kolik je lepší mít po ruce. Vysvětlíme vám to tak, abyste věděli, do čeho jdete.' }
  };

  // ---- nabídka podle cíle z otázky 8 -------------------------------------
  var GOALS = [
    { head: 'Chcete zjistit, co by vám umožnilo pracovat míň?',
      body: 'Na krátké schůzce projdeme, kolik potřebujete na běžný život a co by bylo potřeba, abyste mohli ubrat. Domluvíme se, čím začít.',
      btn: 'Chci probrat víc času pro sebe', topic: 'to, co by vám umožnilo pracovat míň' },
    { head: 'Chcete se připravit na vlastní podnikání?',
      body: 'Na krátké schůzce projdeme, s jakou rezervou do toho jít a na co myslet, až nebudete mít stálý příjem. Domluvíme se, čím začít.',
      btn: 'Chci probrat vlastní podnikání', topic: 'přípravu na vlastní podnikání' },
    { head: 'Chcete dětem připravit lepší start do života?',
      body: 'Na krátké schůzce probereme, kolik a jak dlouho můžete odkládat a jaké máte možnosti spoření pro děti. Domluvíme se, čím začít.',
      btn: 'Chci probrat start pro děti', topic: 'lepší start do života pro vaše děti' },
    { head: 'Chcete si naplánovat delší volno nebo velkou cestu?',
      body: 'Na krátké schůzce spočítáme, kolik budete potřebovat a jak si to rozložit, aby vám pak nechyběly peníze na běžný život. Domluvíme se, čím začít.',
      btn: 'Chci probrat delší volno', topic: 'delší volno nebo cestu' },
    { soft: true, topic: 'váš plán' },
    { head: 'Nemusíte mít hned jasno.',
      body: 'Na krátké schůzce si promluvíme o tom, co by pro vás peníze měly umožnit, a podle toho se domluvíme, čím začít. Nemusíte mít nic připraveného.',
      btn: 'Chci si to promyslet s vámi', topic: 'to, co by vám peníze měly umožnit' }
  ];

  // ---- state ------------------------------------------------------------
  var state = { screen: 'intro', qi: 0, answers: [], extra: {} };

  // Zjištění = jen to, co člověk sám napsal, v pořadí důležitosti; zobrazí se nejvýš dvě.
  // „Nevím“ u úspor je neznámá hodnota, ne nulová rezerva. „Nic se nezměnilo“ nic nevypovídá o tom,
  // jak má člověk finance nastavené. Spořák, investice ani peníze na účtu na další měsíc nejsou chyba.
  function findingsFor(a) {
    var f = [];
    if (a[2] === 4) f.push({ g: 'reserve', a: 'Píšete, že nevíte, na jak dlouho by vám úspory vystačily.', b: 'Zároveň nevíte, na jak dlouho by vám úspory vystačily.' });
    if (a[2] === 0) f.push({ g: 'reserve', a: 'Píšete, že by vám úspory zatím nevystačily ani na měsíc.', b: 'Zároveň by vám úspory zatím nevystačily ani na měsíc.' });
    if (a[0] === 2) f.push({ g: 'spending', a: 'Píšete, že si docela často říkáte, kam peníze zase zmizely.', b: 'Zároveň si docela často říkáte, kam peníze zase zmizely.' });
    if (a[5] === 2) f.push({ g: 'lifechange', a: 'Píšete, že se u vás změnil život, ale finance zatím zůstaly při starém.', b: 'Zároveň se u vás změnil život, ale finance zatím zůstaly při starém.', short: 'Píšete, že finance zatím zůstaly při starém.' });
    if (a[6] === 2) f.push({ g: 'invest', a: 'Píšete, že byste s penězi chtěli něco dělat, ale v investování se zatím nevyznáte.', b: 'Zároveň byste s penězi chtěli něco dělat, ale v investování se zatím nevyznáte.' });
    if (a[0] === 1) f.push({ g: 'spending', a: 'Píšete, že vás občas překvapí, kolik peněz už je pryč.', b: 'Zároveň vás občas překvapí, kolik peněz už je pryč.' });
    if (a[6] === 4) f.push({ g: 'spending', a: 'Píšete, že vám teď většinou nic nezbývá.', b: 'Zároveň vám teď většinou nic nezbývá.' });
    if (a[5] === 1) f.push({ g: 'lifechange', a: 'Píšete, že jste se po změnách ke kontrole všeho ještě nedostali.', b: 'Zároveň jste se po změnách ke kontrole všeho ještě nedostali.' });
    if (a[0] === 3) f.push({ g: 'spending', a: 'Píšete, že se na zůstatek moc nedíváte.', b: 'Zároveň se na zůstatek moc nedíváte.' });
    return f.slice(0, 2);
  }

  // „Máte přehled“ jen tehdy, když to plyne z odpovědí (ví, kam peníze odcházejí, i na jak dlouho vystačí úspory)
  function hasOverview(a) { return a[0] === 0 && [1, 2, 3].indexOf(a[2]) > -1; }

  // ---- render helpers ---------------------------------------------------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function icons() { if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) {} } }
  function paint(html, quiet) {
    root.innerHTML = html;
    if (quiet) { icons(); return; } // překreslení v rámci téže otázky: bez animace a bez skoku nahoru
    root.classList.remove('fade'); void root.offsetWidth; if (!reduce) root.classList.add('fade');
    icons();
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }

  // ---- screens ----------------------------------------------------------
  function renderIntro() {
    paint(
      '<div class="kviz-eyebrow">Finanční kvíz</div>' +
      '<h1 class="kviz-h1">Peníze v běžném životě. Jak to máte vy?</h1>' +
      '<p class="kviz-lead">Něco platíme ze zvyku, něco necháváme na později. Projděte si osm krátkých otázek. Možná vás napadne něco, na co se u sebe podívat.</p>' +
      '<button class="btn btn-dark" data-act="start" style="margin-top:26px;">Zkusit kvíz <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' +
      '<div class="kviz-meta"><i data-lucide="clock" style="width:15px;height:15px;"></i> Asi 3 minuty. Výsledek hned, bez e-mailu.</div>'
    );
  }

  function extraOpen(qi) { var Q = QUESTIONS[qi]; return !!(Q.extra && state.answers[qi] === Q.extra.on); }
  function extraText(qi) { return extraOpen(qi) ? (state.extra[qi] || '').trim() : ''; }

  function renderQuestion(quiet) {
    var qi = state.qi, Q = QUESTIONS[qi], sel = state.answers[qi];
    var extra = extraOpen(qi)
      ? '<div class="kviz-extra"><label for="kv-extra">' + esc(Q.extra.label) + ' <span>(nepovinné)</span></label>' +
        '<div class="kviz-extra-hint">' + esc(Q.extra.hint) + '</div>' +
        '<textarea id="kv-extra" rows="2" maxlength="300">' + esc(state.extra[qi] || '') + '</textarea></div>'
      : '';
    var opts = Q.opts.map(function (t, i) {
      return '<button class="kviz-opt' + (sel === i ? ' sel' : '') + '" data-act="pick" data-i="' + i + '">' +
        '<span class="dot"><i data-lucide="check"></i></span><span>' + esc(t) + '</span></button>';
    }).join('');
    paint(
      '<div class="kviz-prog"><div class="track"><span style="width:' + ((qi + 1) / QUESTIONS.length * 100) + '%"></span></div>' +
      '<div class="lbl">' + (qi + 1) + ' / ' + QUESTIONS.length + '</div></div>' +
      '<div class="kviz-q">' + esc(Q.q) + '</div>' +
      (Q.help ? '<div class="kviz-qhelp">' + esc(Q.help) + '</div>' : '') +
      '<div class="kviz-opts">' + opts + '</div>' + extra +
      '<div class="kviz-nav">' +
      '<button class="kviz-textbtn" data-act="back"' + (qi === 0 ? ' hidden' : '') + '><i data-lucide="arrow-left" style="width:15px;height:15px;"></i> Zpět</button>' +
      (sel != null ? '<button class="btn btn-dark" data-act="next">' + (qi === QUESTIONS.length - 1 ? 'Ukázat výsledek' : 'Pokračovat') + ' <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' : '<span></span>') +
      '</div>',
      quiet
    );
  }

  function knowledgeHtml(a) {
    var right = 0;
    var rows = KNOW.map(function (k) {
      var ok = a[k.i] === QUESTIONS[k.i].correct;
      if (ok) right++;
      return '<div class="know-row">' +
        '<div class="know-q"><span class="tag ' + (ok ? 'tag-ok' : 'tag-no') + '"><i data-lucide="' + (ok ? 'check' : 'x') + '"></i></span>' + esc(k.title) + '</div>' +
        '<div class="know-a">Správně: <b>' + esc(k.correctText) + '</b></div>' +
        '<details class="know-more"' + (ok ? '' : ' open') + '><summary>Proč?</summary><p>' + esc(k.exp) + '</p></details>' +
        '</div>';
    }).join('');
    return '<div class="res-section-lbl">Znalostní otázky · správně ' + right + ' ze 3</div><div class="know">' + rows + '</div>';
  }

  function resultModel(a) {
    var f = findingsFor(a), T = f.length ? THEMES[f[0].g] : null, m = { theme: T ? f[0].g : 'none', step: '' };
    if (T) {
      m.head = T.head;
      m.text = f.map(function (x, i) { return i === 0 ? (x.short || x.a) : x.b; }).join(' ') + (T.note ? ' ' + T.note : '');
      m.step = T.step;
    } else if (hasOverview(a)) {
      m.head = 'V běžných penězích máte přehled.';
      m.text = 'Podle toho, co píšete, víte, kam vám peníze odcházejí a na jak dlouho by vám vystačily úspory. Níže si můžete projít vysvětlení znalostních otázek.';
    } else {
      m.head = 'Díky za vyplnění. Tady jsou odpovědi.';
      m.text = 'Níže si můžete projít vysvětlení znalostních otázek.';
    }
    m.right = KNOW.filter(function (k) { return a[k.i] === QUESTIONS[k.i].correct; }).length;
    return m;
  }

  function renderResult() {
    var a = state.answers, m = resultModel(a), G = GOALS[a[7]];
    var head = m.head, intro = '<p class="res-sub">' + esc(m.text) + '</p>';
    var step = m.step ? '<div class="res-step"><div class="res-step-lbl">První krok</div>' + esc(m.step) +
      '<div><button class="btn btn-dark res-step-btn" data-act="toform" data-src="analysis">Chci podrobnou analýzu <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button></div></div>' : '';

    var offer;
    if (G.soft) {
      offer = '<div class="offer-soft">Svůj plán už máte. Kdybyste si ho chtěli s někým projít nebo něco ověřit, ' +
        'napište nám níže.</div>';
    } else {
      offer = '<div class="offer">' +
        '<h3>' + esc(G.head) + '</h3>' +
        '<p>' + esc(G.body) + '</p>' +
        '</div>';
    }

    state.src = 'goal';
    paint('<div class="res-head">' + esc(head) + '</div>' + intro + step + knowledgeHtml(a) + offer + formHtml());
    bindForm();
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function localDt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDt(v) {
    var d = new Date(v); if (isNaN(d)) return v;
    return d.toLocaleString('cs-CZ', { weekday: 'short', day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function formTopic() { return state.src === 'analysis' ? 'Podrobná analýza příjmů a výdajů' : GOALS[state.answers[7]].topic; }
  function formNote() {
    return 'Navážeme tam, kde kvíz skončil, ' +
      (state.src === 'analysis' ? 'a uděláme s vámi podrobnou analýzu příjmů a výdajů' : 'a probereme hlavně ' + GOALS[state.answers[7]].topic) +
      '. Spolu s kontaktem nám pošlete i odpovědi z kvízu, ať je máme připravené.';
  }

  function formHtml() {
    return '<div class="res-form" id="bk-wrap">' +
      '<div class="res-head" style="font-size:clamp(22px,3vw,30px);">Napište nám a domluvíme termín.</div>' +
      '<div class="bk-meta"><span><i data-lucide="message-circle"></i>Úvodní setkání s Finance Labem</span><span><i data-lucide="video"></i>Online nebo osobně</span></div>' +
      '<p class="res-note" id="bk-note" style="margin-top:12px;">' + esc(formNote()) + '</p>' +
      '<form class="bk-form" id="bk-form" novalidate>' +
      '<input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<div class="frow"><label for="bk-name">Jméno a příjmení</label><input id="bk-name" name="name" type="text" autocomplete="name" placeholder="Jan Novák"></div>' +
      '<div class="frow2">' +
      '<div class="frow"><label for="bk-email">E-mail <span class="req">*</span></label><input id="bk-email" name="email" type="email" autocomplete="email" placeholder="vas@email.cz" required><div class="emsg">Zadejte platný e-mail.</div></div>' +
      '<div class="frow"><label for="bk-phone">Telefon <span class="req">*</span></label><input id="bk-phone" name="phone" type="tel" autocomplete="tel" placeholder="+420 777 123 456" required><div class="emsg">Zadejte telefonní číslo.</div></div>' +
      '</div>' +
      '<div class="frow"><label for="bk-time">Preferovaný termín schůzky <span class="req">*</span></label><input id="bk-time" name="preferred_time" type="datetime-local" min="' + localDt(new Date()) + '" required><div class="emsg">Vyberte termín, který vám sedí.</div></div>' +
      '<div class="frow"><label for="bk-msg">Doplňující zpráva</label><textarea id="bk-msg" name="message" rows="3" placeholder="Napište nám krátce k vaší situaci (nepovinné)."></textarea></div>' +
      '<button type="submit" class="btn btn-dark" style="width:100%;justify-content:center;margin-top:20px;">Odeslat objednávku <i data-lucide="arrow-right" style="width:16px;height:16px;"></i></button>' +
      '<div class="bk-status" id="bk-status" role="status" aria-live="polite"></div>' +
      '<p class="bk-consent">Odesláním souhlasíte se zpracováním údajů za účelem kontaktu. Vaše data nikam neprodáváme.</p>' +
      '</form></div>';
  }

  function bindForm() {
    var form = document.getElementById('bk-form');
    if (!form) return;
    var status = document.getElementById('bk-status');
    var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var say = function (cls, t) { status.className = 'bk-status' + (cls ? ' ' + cls : ''); status.textContent = t; };
    var setErr = function (input, on) { var w = input.closest('.frow'); if (w) w.classList.toggle('field-err', on); };
    ['email', 'phone', 'preferred_time'].forEach(function (n) {
      form[n].addEventListener('input', function () { setErr(form[n], false); say('', ''); });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var t = form.preferred_time.value, when = t ? new Date(t) : null;
      var checks = [
        [form.email, emailRe.test((form.email.value || '').trim())],
        [form.phone, (form.phone.value || '').replace(/\s/g, '').length >= 6],
        [form.preferred_time, !!when && !isNaN(when) && when > new Date()]
      ];
      var firstBad = null;
      checks.forEach(function (c) { setErr(c[0], !c[1]); if (!c[1] && !firstBad) firstBad = c[0]; });
      if (firstBad) { say('bad', 'Zkontrolujte prosím vyznačená pole.'); firstBad.focus(); return; }
      if (form.botcheck.checked) { renderSent(); return; } // robot vyplnil skryté pole
      var key = formKey();
      if (!key || key.indexOf('REPLACE') === 0) { say('bad', 'Formulář zatím není propojený s e-mailem (chybí přístupový klíč).'); return; }

      var a = state.answers, m = resultModel(a), inv = extraText(6);
      var answers = QUESTIONS.map(function (Q, i) {
        return (i + 1) + '. ' + Q.q + '\n   → ' + Q.opts[a[i]] + (i === 6 && inv ? '\n   Do čeho investuje: ' + inv : '');
      }).join('\n');
      var fd = new FormData();
      fd.append('access_key', key);
      fd.append('subject', 'Nová objednávka z kvízu — Finance Lab');
      fd.append('from_name', 'Finance Lab kvíz');
      fd.append('name', form.name.value || '—');
      fd.append('email', form.email.value.trim());
      fd.append('phone', form.phone.value.trim());
      fd.append('preferovany_termin', fmtDt(t));
      fd.append('zprava', form.message.value || '—');
      fd.append('tema', formTopic());
      fd.append('vysledek', m.head + (m.theme !== 'none' ? ' — ' + m.text : ''));
      fd.append('znalostni_otazky', m.right + ' ze 3 správně');
      fd.append('do_ceho_investuje', inv || '—');
      fd.append('odpovedi_z_kvizu', answers);

      var btn = form.querySelector('button[type=submit]'); btn.disabled = true;
      say('', 'Odesílám…');
      fetch('https://api.web3forms.com/submit', { method: 'POST', body: fd })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.success) renderSent();
          else { btn.disabled = false; say('bad', 'Odeslání se nepodařilo. Zkuste to prosím znovu.'); }
        })
        .catch(function () { btn.disabled = false; say('bad', 'Odeslání se nepodařilo. Zkuste to prosím znovu.'); });
    });
  }

  // Formulář jen předává preferovaný termín, není to potvrzená rezervace.
  function renderSent() {
    var w = document.getElementById('bk-wrap'); if (!w) return;
    w.innerHTML = '<div class="done-wrap">' +
      '<div class="done-ic"><i data-lucide="check"></i></div>' +
      '<h2>Děkujeme, máme to.</h2>' +
      '<p>Ozveme se vám a domluvíme termín, který vám sedí. Vaše odpovědi z kvízu budeme mít připravené.</p>' +
      '<a href="index.html" class="btn btn-white" style="margin-top:22px;">Zpět na Finance Lab</a>' +
      '</div>';
    icons();
    w.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
  }

  // ---- global click handling -------------------------------------------
  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'start') { state.screen = 'quiz'; state.qi = 0; renderQuestion(); }
    else if (act === 'pick') {
      state.answers[state.qi] = parseInt(el.getAttribute('data-i'), 10);
      if (extraOpen(state.qi)) {
        renderQuestion(true);
        var ta = document.getElementById('kv-extra');
        if (ta) {
          // na počítači rovnou kurzor do políčka; na mobilu jen dorolovat, ať nevyskočí klávesnice
          if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) ta.focus();
          else ta.closest('.kviz-extra').scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
        }
      }
      else if (reduce) { advance(); }
      else {
        root.querySelectorAll('.kviz-opt').forEach(function (o) { o.classList.remove('sel'); });
        el.classList.add('sel');
        setTimeout(function () { advance(); }, 240);
      }
    }
    else if (act === 'next') { advance(); }
    else if (act === 'back') { if (state.qi > 0) { state.qi--; renderQuestion(); } }
    else if (act === 'toform') {
      state.src = el.getAttribute('data-src') || 'goal';
      var note = document.getElementById('bk-note'); if (note) note.textContent = formNote();
      var w = document.getElementById('bk-wrap'); if (w) w.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    }
  });

  root.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'kv-extra') state.extra[state.qi] = e.target.value;
  });

  function advance() {
    if (state.answers[state.qi] == null) return;
    if (state.qi < QUESTIONS.length - 1) { state.qi++; renderQuestion(); }
    else { state.screen = 'result'; renderResult(); }
  }

  renderIntro();
})();
</script>
</body>
</html>
